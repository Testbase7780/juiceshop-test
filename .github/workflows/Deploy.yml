name: Deploy Juice Shop

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '18.x'

    - name: Install dependencies
      run: npm install

    - name: Build Docker image
      run: docker build -t bkimminich/juice-shop .

    - name: Push Docker image
      run: docker push bkimminich/juice-shop
